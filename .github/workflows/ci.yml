name: CI

# Runs the same checks documented in PHASE_A-E_REPORT.md / RELEASE_CHECKLIST.md,
# as real CI instead of a manually-run checklist. Mirrors the actual local dev
# commands 1:1 -- nothing here is invented; every job/step corresponds to a
# command that was run and verified during Phase E (see PHASE_E_REPORT.md).
#
# Go and Java are still included as jobs (matrix-complete per Phase E objective 8),
# even though this sandbox could not run them itself (no Go toolchain, no JDK
# compiler / Maven Central access here) -- a real GitHub Actions runner has both,
# so these jobs are expected to actually execute in real CI, not just be present.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relayhub
          POSTGRES_PASSWORD: relayhub
          POSTGRES_DB: relayhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relayhub" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt pytest ruff mypy
      - name: Tests (sqlite, matches local dev)
        working-directory: backend
        run: pytest -q
      - name: Lint
        working-directory: backend
        run: ruff check app
      - name: Typecheck
        working-directory: backend
        run: mypy app --ignore-missing-imports

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install deps
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Lint
        working-directory: apps/web
        run: npx next lint
      - name: Build
        working-directory: apps/web
        run: npx next build

  node-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: sdks/node
        run: npm ci --no-audit --no-fund
      - working-directory: sdks/node
        run: npm run build
      - working-directory: sdks/node
        run: npm run pretest && npm test

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: sdks/python
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e . pytest ruff mypy
      - working-directory: sdks/python
        run: pytest -q
      - working-directory: sdks/python
        run: ruff check relayhub tests
      - working-directory: sdks/python
        run: mypy relayhub

  go-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - working-directory: sdks/go
        run: go build ./...
      - working-directory: sdks/go
        run: go test ./...
      - working-directory: sdks/go
        run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out

  java-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - working-directory: sdks/java
        run: mvn -B compile test

  cli:
    runs-on: ubuntu-latest
    needs: node-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: sdks/node
        run: npm ci --no-audit --no-fund && npm run build
      - working-directory: cli
        run: npm install --no-audit --no-fund
      - working-directory: cli
        run: npx tsc --noEmit -p tsconfig.json
      - working-directory: cli
        run: npx tsc -p tsconfig.json
      - name: Smoke tests
        working-directory: cli
        run: |
          node dist/index.js version
          node dist/index.js --help
          node dist/index.js doctor || true
          node dist/index.js completion bash
          node dist/index.js config path

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t relayhub-backend:ci backend/
      - name: Build frontend image
        run: docker build -f apps/web/Dockerfile -t relayhub-web:ci .
      - name: Validate compose files
        run: |
          docker compose -f infra/docker/docker-compose.yml config -q
          docker compose -f infra/docker/docker-compose.prod.yml config -q
