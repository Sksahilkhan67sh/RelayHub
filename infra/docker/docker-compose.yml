version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relayhub
      POSTGRES_PASSWORD: relayhub
      POSTGRES_DB: relayhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - ../../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../../backend:/app

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - ../../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - ../../backend:/app

  # G-1 fix (Phase 4A): analyze_endpoint_health / analyze_all_endpoints are routed to
  # the "insights" queue (see app/workers/celery_app.py's task_routes), but the
  # `worker` service above has no `-Q` flag, so it only ever consumes the default
  # queue. Without this service, Beat schedules insights tasks and they queue up in
  # Redis forever, unconsumed -- the entire AI/insights pipeline (health snapshots,
  # anomalies, incidents, RCA, AI recommendations) silently never runs. This service
  # is identical to `worker` except for the queue it listens on.
  worker-insights:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - ../../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker -Q insights --loglevel=info
    volumes:
      - ../../backend:/app

  beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - ../../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - ../../backend:/app

volumes:
  pgdata:
